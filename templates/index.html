<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantor Imigrasi Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container">

    <div class="sidebar"> 
        <!-- Menambahkan gambar logo di bagian atas -->
        <img src="{{ url_for('static', filename='image/logo1.jpg') }}" alt="Logo Imigrasi" class="sidebar-logo">
        <div class="title">Kantor Imigrasi<br>Chatbot</div> 
        <button id="homeButton">Home</button> 
        <button id="historyButton">Riwayat</button> 
        <button>Tentang</button> 
        <div class="history-title">Riwayat Chat</div> 
        <div id="historyList"></div>

    </div>

    <div class="main">

        <div id="heroSection">
            <h1>HALO PENGUNJUNG</h1>
            <h3>Apa yang bisa saya bantu hari ini?</h3>
        </div>

        <div class="input-box">
            <input id="question" type="text" placeholder="Masukkan pertanyaan anda disini" autocomplete="off">
            <button id="sendButton">➜</button>
        </div>

        <div id="suggestionSection">
            <div class="suggestion-title">Rekomendasi Pertanyaan</div>
            <div class="suggestions">
                <button class="suggestion">Apa itu KITAS?</button>
                <button class="suggestion">Berapa Pembayaran KITAP</button>
                <button class="suggestion">Cara apply SKIM</button>
            </div>
        </div>

        <div id="chatArea"></div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
