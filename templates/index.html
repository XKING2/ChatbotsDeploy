
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='image/logo1.png') }}">
    <title>Kantor Imigrasi Chatbot</title>
</head>
</html>


<script>
(function () {
  var theme = null;
  try { theme = localStorage.getItem("chatbot-theme"); } catch (e) {}
  if (theme !== "dark" && theme !== "light") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app" id="app">

    <!-- Lapisan gelap di belakang drawer (hanya muncul di layar sempit) -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar" aria-label="Menu dan riwayat chat">
        <div class="sidebar-header">
            <button type="button" class="icon-button sidebar-close" id="sidebarClose" aria-label="Tutup menu">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <img src="{{ url_for('static', filename='image/logo1.png') }}" alt="Logo Kantor Imigrasi" class="sidebar-logo">
            <div class="title">Kantor Imigrasi<br>Chatbot</div>
        </div>

        <nav class="sidebar-nav" aria-label="Navigasi">
            <button type="button" class="sidebar-button" id="homeButton">Home</button>
        </nav>

        <div class="history-title" id="historyTitle">Riwayat Chat</div>
        <div class="history-list" id="historyList" aria-labelledby="historyTitle"></div>

        <div class="sidebar-footer">
            <button type="button" class="sidebar-button theme-toggle" aria-label="Ganti ke mode gelap">
                <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                <span class="theme-toggle-label">Mode gelap</span>
            </button>
        </div>
    </aside>

    <main class="main is-empty" id="main">

        <!-- Header ringkas: hanya tampil di layar sempit (di layar lebar sidebar sudah permanen) -->
        <header class="chat-header">
            <button type="button" class="icon-button menu-button" id="menuButton" aria-label="Buka menu" aria-controls="sidebar" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <img src="{{ url_for('static', filename='image/logo1.png') }}" alt="" class="chat-header-logo">
            <span class="chat-header-title">Kantor Imigrasi Chatbot</span>
            <button type="button" class="icon-button theme-toggle" aria-label="Ganti ke mode gelap">
                <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            </button>
        </header>

        <div id="heroSection" class="hero">
            <h1>HALO PENGUNJUNG</h1>
            <h3>Apa yang bisa saya bantu hari ini?</h3>
        </div>

        <div id="suggestionSection" class="suggestion-section">
            <div class="suggestion-title">Rekomendasi Pertanyaan</div>
            <!-- Diisi script.js: beberapa pertanyaan acak dari daftar SUGGESTION_POOL -->
            <div class="suggestions" id="suggestionList" role="group" aria-label="Contoh pertanyaan"></div>
        </div>

        <div id="chatArea" class="chat-area" role="log" aria-label="Percakapan"></div>

        <div class="input-box">
            <input id="question" type="text" placeholder="Masukkan pertanyaan anda disini" aria-label="Pertanyaan Anda" autocomplete="off" enterkeyhint="send">
            <button type="button" id="sendButton" aria-label="Kirim pesan">➜</button>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
