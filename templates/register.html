<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar - Kantor Imigrasi Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<div class="auth-box">
    <img src="{{ url_for('static', filename='image/logo1.jpg') }}" alt="Logo Imigrasi" class="auth-logo">
    <h1>Buat Akun</h1>
    <p class="subtitle">Supaya riwayat chat kamu tersimpan</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-messages">
            {% for message in messages %}
            <div class="flash-message">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">
        <label for="name">Nama</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">

        <label for="confirm_password">Konfirmasi Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6">

        <button type="submit">Daftar</button>
    </form>

    <div class="switch-link">
        Sudah punya akun? <a href="{{ url_for('login') }}">Login di sini</a>
    </div>
</div>
</body>
</html>
